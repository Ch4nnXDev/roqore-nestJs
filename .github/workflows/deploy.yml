name: Deploy NestJS

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: roqore-nestjs/backend

      - name: Build
        run: npm run build
        working-directory: roqore-nestjs/backend

      - name: Write SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: devuser
          key_path: key.pem      # <-- use key_path here
          port: 22
          script: |
            cd ~/roqore-nestJs/roqore-nestjs/backend
            git pull origin dev
            npm install
            npm run build
            pm2 reload ecosystem.config.js --env production

